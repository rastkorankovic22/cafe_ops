spring:
  application:
    name: cafe-ops-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/cafeops}
    username: ${SPRING_DATASOURCE_USERNAME:cafeops}
    password: ${SPRING_DATASOURCE_PASSWORD:cafeops}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Belgrade
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8080